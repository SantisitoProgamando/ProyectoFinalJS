<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechMarket</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>
<body>
    <header class="header-principal">
        <h1>TechMarket Componentes</h1>
        <div style="display: flex; gap: 2rem; align-items: center;">
            <div id="menu-usuario">
                <span id="texto-bienvenida" style="display: none;
                color: var(--acento-purpura);font-weight: bold; margin-right: 1rem;"></span>
                <button id="btn-abrir-login" class="btn-agregar" style="padding: 0.5rem 1rem;">Ingresar</button>
                <button id="btn-cerrar-sesion" class="btn-eliminar" style="display:none;">Salir</button>
            </div>
        </div>
        <div class="carrito-info" id="btn-abrir-carrito" style="cursor: pointer;">
            <span>Items: <b id="contador-carrito">0</b></span>
        </div>
    </header>
    <main class="contenedor">
        <section class="seccion-clientes">
            <h2>Clientes VIP</h2>
            <ul id="contenedor-clientes" class="lista-clientes"></ul>
        </section>

        <section class="seccion-productos">
            <h2>Catalogo de Hardware</h2>
            <div id="contenedor-productos" class="grid-productos"></div>
        </section>
    </main>

    <div id="modal-carrito" class="modal-oculto">
        <div class="modal-contenido">
            <div class="modal-header">
                <h2>Tu carrito</h2>
                <button id="btn-cerrar-carrito" class="btn-cerrar">X</button>
            </div>
            <div id="contenedor-items-carrito"></div>
            <div class="modal-footer">
                <p class="total-texto">Total: $<span id="precio-total">0</span></p>
                <button id="btn-comprar" class="btn-agregar">Finalizar Compra</button>
            </div>
        </div>
    </div>

    <div id="modal-login" class="modal-oculto">
        <div class="modal-contenido" style="max-width: 400px;">
            <div class="modal-header">
                <h2>Acceso a TechMarket</h2>
                <button id="btn-cerrar-login" class="btn-cerrar">X</button>
            </div>
            
            <div style="display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem;">
                <div>
                    <label style="color: var(--texto-secundario); font-size: 0.9rem;">Usuario (Email)</label>
                    <input type="email" id="input-email" placeholder="ejemplo@correo.com" style="width: 100%; padding: 0.8rem; border-radius: 6px; border: 1px solid #4a253a; background-color: var(--fondo-oscuro); color: white; margin-top: 0.5rem;">
                </div>
                <div>
                    <label style="color: var(--texto-secundario); font-size: 0.9rem;">Contraseña</label>
                    <input type="password" id="input-password" placeholder="******" style="width: 100%; padding: 0.8rem; border-radius: 6px; border: 1px solid #4a253a; background-color: var(--fondo-oscuro); color: white; margin-top: 0.5rem;">
                </div>
                
                <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                    <button id="btn-login" class="btn-agregar" style="background-color: var(--acento-purpura);">Iniciar Sesión</button>
                    <button id="btn-registrar" class="btn-agregar">Registrarse</button>
                </div>
            </div>
        </div>
    </div>
    <script src="js/app.js"></script>
    <script src="js/clientes.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
