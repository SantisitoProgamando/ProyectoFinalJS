<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechMarket</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>
<body>
    <header class="header-principal">
        <h1>TechMarket Componentes</h1>
        <div class="carrito-info">
            <span>Items: <b id="contador-carrito">0</b></span>
        </div>
    </header>
    <main class="contenedor">
        <section class="seccion-clientes">
            <h2>Clientes VIP</h2>
            <ul id="contenedor-clientes" class="lista-clientes"></ul>
        </section>

        <section class="seccion-productos">
            <h2>Catalogo de Hardware</h2>
            <div id="contenedor-productos" class="grid-productos"></div>
        </section>
    </main>
    <script src="js/app.js"></script>
    <script src="js/clientes.js"></script>
</body>
</html>
